<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CADI Assist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@300;400;500;600;700;800&family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary-dark:   #3C023C;
      --primary:        #621360;
      --secondary-dark: #0078B4;
      --secondary:      #00A0FF;
      --black:          #000000;
      --dark-grey:      #505457;
      --mid-grey:       #ABAAAA;
      --light-grey:     #D1D1D1;
      --lighter-grey:   #F7F7F7;
      --off-white:      #FAFAFA;
      --white:          #FFFFFF;
    }

    html, body, #root { height: 100%; }

    body {
      font-family: 'Open Sans', sans-serif;
      background: var(--primary-dark);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); opacity: 0.45; }
      50%       { transform: translateY(-5px); opacity: 1; }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes stepIn {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .header-accent {
      position: absolute;
      top: 0; right: 0;
      width: 220px; height: 100%;
      background: linear-gradient(135deg, transparent 40%, rgba(0,160,255,0.08) 40%);
      pointer-events: none;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
// ============================================================================
// CONFIGURATION — same values as the search page
// ============================================================================
const PROXY_URL = "https://cadi-search-proxy.kristian-band.workers.dev";

const GITHUB_RAW_INDEX_URL =
  "https://raw.githubusercontent.com/University-of-Portsmouth-Web-Team/CADI_Claude_Agentic_Search/main/search-index.json";

// ============================================================================
// FALLBACK INDEX — same as search page
// ============================================================================
const FALLBACK_INDEX = [
  { id: 1,  url: "https://cadi.port.ac.uk/cpd-support",                  title: "CPD and Support",                      excerpt: "The main hub for Continuing Professional Development opportunities at the University of Portsmouth.",             content: "CPD opportunities including workshops on active blended learning, assessment design, digital tools, AdvanceHE fellowship pathways, PGCertHE, and peer observation schemes. Timetabled sessions throughout the academic year.", type: "page",     tags: ["cpd", "professional development", "fellowship", "workshops", "training"] },
  { id: 2,  url: "https://cadi.port.ac.uk/fellowship",                   title: "AdvanceHE Fellowship",                  excerpt: "Routes to achieving Fellowship of AdvanceHE — Associate, Fellow, Senior Fellow, Principal Fellow.",               content: "Fellowship pathways: D1 Associate Fellow, D2 Fellow (FHEA), D3 Senior Fellow, D4 Principal Fellow. PGCertHE leads to fellowship. CATE awards.",                                                                             type: "page",     tags: ["fellowship", "advancehe", "hea", "pgcerthe", "cate"] },
  { id: 3,  url: "https://cadi.port.ac.uk/cpd-timetable",               title: "CPD Timetable",                         excerpt: "View and book upcoming CPD sessions, workshops and events.",                                                     content: "Full CPD timetable: ABL workshops, assessment design, digital tools, fellowship preparation, peer observation, inclusive curriculum. CPD catalogue. CPD calendar.",                                                          type: "page",     tags: ["cpd", "timetable", "calendar", "workshops", "catalogue"] },
  { id: 4,  url: "https://cadi.port.ac.uk/peer-observation",            title: "Peer Observation",                      excerpt: "The peer observation scheme supports reflective teaching through collaborative observation.",                    content: "Peer observation for professional development. ObserveWell platform for recording observations. Observation links to fellowship evidence.",                                                                                 type: "page",     tags: ["peer observation", "observe", "observewell", "teaching practice"] },
  { id: 5,  url: "https://cadi.port.ac.uk/active-blended-learning",     title: "Active Blended Learning (ABL)",         excerpt: "The ABL framework underpins curriculum design at the University of Portsmouth.",                               content: "Active Blended Learning combines online and face-to-face activities. Seven learning types: assimilative, finding and handling information, communicative, productive, experiential, interactive, adaptive.",               type: "page",     tags: ["active blended learning", "abl", "pedagogy", "curriculum design", "learning types"] },
  { id: 6,  url: "https://cadi.port.ac.uk/assessment-information-resource", title: "Assessment Information Resource (AIR)", excerpt: "Guidance on assessment design, authentic assessment, categorical marking and reasonable adjustments.",        content: "Authentic assessment design, categorical marking guidance, reasonable adjustments, assessment choice, learning outcomes alignment.",                                                                                         type: "resource", tags: ["assessment", "air", "authentic assessment", "categorical marking", "reasonable adjustments"] },
  { id: 7,  url: "https://cadi.port.ac.uk/enable",                      title: "enABLe — Inclusive Curriculum",        excerpt: "enABLe supports inclusive curriculum design and accessible learning resources.",                               content: "Inclusive curriculum design, accessible resources, accessibility guidelines, Universal Design for Learning (UDL), reasonable adjustments.",                                                                                  type: "page",     tags: ["enable", "accessibility", "inclusive curriculum", "accessible resources"] },
  { id: 8,  url: "https://cadi.port.ac.uk/learning-teaching-conference-2026", title: "Learning and Teaching Conference 2026", excerpt: "Annual conference showcasing innovative teaching practice. Call for papers now open.",                  content: "2026 Learning and Teaching Conference. Call for papers open. Theme: Connected Curriculum.",                                                                                                                                  type: "event",    tags: ["conference", "learning and teaching", "call for papers", "ltc2026"] },
  { id: 9,  url: "https://cadi.port.ac.uk/panopto",                     title: "Panopto — Video Capture",              excerpt: "Panopto is the University's video capture and streaming platform.",                                           content: "Panopto: lecture recording, screen capture, Smart Capture, video streaming. Integrated with Moodle.",                                                                                                                        type: "resource", tags: ["panopto", "video", "smart capture", "lecture recording"] },
  { id: 10, url: "https://cadi.port.ac.uk/connected-curriculum",        title: "Connected Curriculum",                 excerpt: "The Connected Curriculum framework connects learning across six dimensions.",                                  content: "Connected Curriculum: connects with research, progression, research community, wider world, each other across disciplines.",                                                                                                  type: "page",     tags: ["connected curriculum", "curriculum design", "research", "blended and connected"] },
];

// ============================================================================
// EXAMPLE PROMPTS
// ============================================================================
const EXAMPLE_PROMPTS = [
  "How do I get AdvanceHE Fellowship?",
  "What CPD sessions are coming up?",
  "Tell me about peer observation",
  "What is active blended learning?",
  "Learning and Teaching Conference 2026",
];

// ============================================================================
// COLOURS — identical to search page
// ============================================================================
const C = {
  primaryDark:   "#3C023C",
  primary:       "#621360",
  secondaryDark: "#0078B4",
  secondary:     "#00A0FF",
  black:         "#000000",
  darkGrey:      "#505457",
  midGrey:       "#ABAAAA",
  lightGrey:     "#D1D1D1",
  lighterGrey:   "#F7F7F7",
  offWhite:      "#FAFAFA",
  white:         "#FFFFFF",
};
const T = {
  bg:        C.primaryDark,
  text:      C.offWhite,
  subtext:   C.lightGrey,
  muted:     C.midGrey,
  border:    "rgba(255,255,255,0.1)",
  card:      "rgba(255,255,255,0.04)",
  cardHover: "rgba(255,255,255,0.07)",
};

// ============================================================================
// AGENT STEP LABELS
// ============================================================================
const AGENT_STEPS = [
  "Reading knowledge base…",
  "Understanding your question…",
  "Composing response…",
];

// ============================================================================
// APP
// ============================================================================
const { useState, useEffect, useRef, useCallback } = React;

function App() {
  const [messages,  setMessages]  = useState([]);
  const [input,     setInput]     = useState("");
  const [loading,   setLoading]   = useState(false);
  const [pageIndex, setPageIndex] = useState(FALLBACK_INDEX);
  const [steps,     setSteps]     = useState([]);

  const messagesEndRef = useRef(null);
  const inputRef       = useRef(null);
  const stepsTimers    = useRef([]);

  // Load live index
  useEffect(() => {
    if (!GITHUB_RAW_INDEX_URL.includes("YOUR-ORG")) {
      fetch(GITHUB_RAW_INDEX_URL)
        .then(r => r.json())
        .then(data => { if (data.pages?.length > 0) setPageIndex(data.pages); })
        .catch(() => {});
    }
  }, []);

  // Scroll to bottom on new messages
  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages, steps]);

  // Build system prompt with index as knowledge
  const buildSystemPrompt = useCallback((index) => {
    const knowledge = index.map(p =>
      `TITLE: ${p.title}\nURL: ${p.url}\nTYPE: ${p.type}\nSUMMARY: ${p.excerpt}\nDETAIL: ${(p.content || "").slice(0, 500)}\nTAGS: ${(p.tags || []).join(", ")}`
    ).join("\n\n---\n\n");

    return `You are CADI Assist, a helpful conversational assistant for the Centre for Academic Development & Innovation (CADI) at the University of Portsmouth.

You help academic staff find information about CPD, fellowship pathways, peer observation, learning design, assessment, inclusive curriculum, learning technologies, and CADI events.

Use the knowledge base below to answer questions. When a page is relevant, naturally mention it and include its URL as a markdown link. Be warm, concise, and conversational — 2 to 4 short paragraphs maximum. Use plain English. If you don't have specific information (like exact dates), say so and direct the person to check the CADI website or contact the team.

KNOWLEDGE BASE:
${knowledge}`;
  }, []);

  const startSteps = () => {
    setSteps([]);
    stepsTimers.current.forEach(clearTimeout);
    stepsTimers.current = AGENT_STEPS.map((label, i) =>
      setTimeout(() => setSteps(prev => [...prev, label]), i * 550)
    );
  };

  const clearStepTimers = () => {
    stepsTimers.current.forEach(clearTimeout);
    setSteps([]);
  };

  const send = useCallback(async (text) => {
    const trimmed = (text || input).trim();
    if (!trimmed || loading) return;

    setInput("");
    setLoading(true);
    setMessages(prev => [...prev, { role: "user", text: trimmed }]);

    startSteps();

    // Build conversation history for API
    const history = messages.map(m => ({
      role: m.role === "user" ? "user" : "assistant",
      content: m.text,
    }));
    history.push({ role: "user", content: trimmed });

    try {
      const resp = await fetch(PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          system: buildSystemPrompt(pageIndex),
          messages: history,
        }),
      });

      const data  = await resp.json();
      if (data.error) throw new Error(data.error.message || "API error");
      const reply = data.content?.find(b => b.type === "text")?.text || "Sorry, I couldn't generate a response.";

      clearStepTimers();
      setMessages(prev => [...prev, { role: "assistant", text: reply }]);
    } catch (e) {
      clearStepTimers();
      setMessages(prev => [...prev, {
        role: "assistant",
        text: "I'm having trouble connecting right now. Please try again in a moment.",
        error: true,
      }]);
    }

    setLoading(false);
    setTimeout(() => inputRef.current?.focus(), 100);
  }, [input, loading, messages, pageIndex, buildSystemPrompt]);

  const handleKey = (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  };

  const clearChat = () => {
    setMessages([]);
    clearStepTimers();
    setLoading(false);
    setInput("");
    setTimeout(() => inputRef.current?.focus(), 50);
  };

  // ── Styles ────────────────────────────────────────────────────────────────
  const s = {
    root: {
      display: "flex",
      flexDirection: "column",
      height: "100vh",
      background: `linear-gradient(160deg, ${C.primaryDark} 0%, ${C.primary} 60%, ${C.primaryDark} 100%)`,
      color: T.text,
      fontFamily: "'Open Sans', sans-serif",
    },

    // Header
    header: {
      position: "relative",
      overflow: "hidden",
      background: "rgba(0,0,0,0.35)",
      borderBottom: `2px solid ${C.secondary}`,
      padding: "14px 32px",
      display: "flex",
      alignItems: "center",
      gap: 14,
      flexShrink: 0,
    },
    logoMark: {
      width: 36, height: 36,
      background: `linear-gradient(135deg, ${C.secondary} 0%, ${C.secondaryDark} 100%)`,
      display: "flex", alignItems: "center", justifyContent: "center",
      fontFamily: "'Encode Sans Expanded', sans-serif",
      fontWeight: 800, fontSize: 13,
      color: C.white, letterSpacing: 0.5, flexShrink: 0,
    },
    logoText: {
      fontFamily: "'Encode Sans Expanded', sans-serif",
      fontWeight: 700, fontSize: 17,
      color: C.white, letterSpacing: 1, lineHeight: 1.1,
    },
    logoSub: {
      fontSize: 9, color: T.muted,
      letterSpacing: 1.5, textTransform: "uppercase", marginTop: 1,
    },
    divider: {
      width: 1, height: 36,
      background: "rgba(0,160,255,0.3)",
      margin: "0 10px",
    },
    headerLabel: {
      fontSize: 11, color: T.muted,
      letterSpacing: 2, textTransform: "uppercase",
    },
    badge: {
      marginLeft: "auto",
      fontSize: 10,
      background: "rgba(0,160,255,0.15)",
      border: "1px solid rgba(0,160,255,0.4)",
      padding: "4px 12px",
      color: C.secondary,
      letterSpacing: 1, fontWeight: 600, textTransform: "uppercase",
    },

    // Messages area
    messagesArea: {
      flex: 1,
      overflowY: "auto",
      padding: "32px",
      display: "flex",
      flexDirection: "column",
      gap: 0,
      maxWidth: 800,
      width: "100%",
      margin: "0 auto",
      alignSelf: "center",
    },

    // Empty state
    emptyWrap: {
      flex: 1,
      display: "flex",
      flexDirection: "column",
      justifyContent: "center",
      maxWidth: 800,
      width: "100%",
      margin: "0 auto",
      padding: "32px",
    },
    eyebrow: {
      fontFamily: "'Encode Sans Expanded', sans-serif",
      fontSize: 10, fontWeight: 600,
      letterSpacing: 3, textTransform: "uppercase",
      color: C.secondary, marginBottom: 12,
    },
    h1: {
      fontFamily: "'Encode Sans Expanded', sans-serif",
      fontSize: "clamp(24px, 4vw, 40px)",
      fontWeight: 800,
      color: C.white,
      margin: "0 0 10px",
      lineHeight: 1.15,
      letterSpacing: -0.5,
    },
    subtitle: {
      fontSize: 14, color: T.muted,
      margin: "0 0 32px", lineHeight: 1.6,
    },
    chipWrap: {
      display: "flex", flexWrap: "wrap", gap: 8,
    },
    chip: {
      background: "rgba(0,0,0,0.25)",
      border: "1px solid rgba(255,255,255,0.1)",
      padding: "7px 16px",
      fontSize: 12, color: T.muted,
      cursor: "pointer",
      fontFamily: "'Open Sans', sans-serif",
      transition: "all 0.15s",
    },

    // Message bubbles
    msgWrap: {
      display: "flex",
      gap: 14,
      marginBottom: 24,
      animation: "fadeSlideUp 0.25s ease",
    },
    msgAvatar: (role) => ({
      width: 30, height: 30,
      background: role === "user"
        ? "rgba(255,255,255,0.08)"
        : `linear-gradient(135deg, ${C.secondary} 0%, ${C.secondaryDark} 100%)`,
      display: "flex", alignItems: "center", justifyContent: "center",
      flexShrink: 0, marginTop: 2,
      fontFamily: "'Encode Sans Expanded', sans-serif",
      fontSize: 11, fontWeight: 800, color: C.white,
    }),
    msgContent: {
      flex: 1, minWidth: 0,
    },
    msgLabel: {
      fontSize: 10, fontWeight: 700,
      letterSpacing: 1.5, textTransform: "uppercase",
      marginBottom: 6,
    },
    msgBubble: (role, isError) => ({
      padding: "14px 18px",
      background: role === "user"
        ? "rgba(0,0,0,0.2)"
        : isError
          ? "rgba(220,38,38,0.1)"
          : "rgba(0,0,0,0.25)",
      border: role === "user"
        ? "1px solid rgba(255,255,255,0.08)"
        : isError
          ? "1px solid rgba(220,38,38,0.3)"
          : "1px solid rgba(0,160,255,0.15)",
      borderLeft: role === "assistant" && !isError
        ? `3px solid ${C.secondary}`
        : undefined,
      fontSize: 14,
      lineHeight: 1.7,
      color: isError ? "#fca5a5" : T.subtext,
    }),

    // Thinking indicator
    thinkingWrap: {
      display: "flex", gap: 14, marginBottom: 24,
    },
    thinkingBubble: {
      padding: "14px 18px",
      background: "rgba(0,0,0,0.25)",
      border: `1px solid rgba(0,160,255,0.15)`,
      borderLeft: `3px solid ${C.secondary}`,
      flex: 1,
    },
    stepRow: {
      display: "flex", alignItems: "center", gap: 8,
      fontSize: 12, color: T.muted,
      padding: "3px 0",
      animation: "stepIn 0.25s ease",
    },
    stepDot: {
      width: 6, height: 6,
      background: C.secondary,
      flexShrink: 0,
    },
    stepSpinner: {
      width: 10, height: 10,
      border: `1.5px solid ${C.secondary}`,
      borderTopColor: "transparent",
      animation: "spin 0.7s linear infinite",
      flexShrink: 0,
    },

    // Input bar
    inputBar: {
      background: "rgba(0,0,0,0.35)",
      borderTop: `1px solid rgba(255,255,255,0.08)`,
      padding: "16px 32px",
      flexShrink: 0,
    },
    inputInner: {
      maxWidth: 800, margin: "0 auto",
      display: "flex", gap: 10, alignItems: "flex-end",
    },
    textarea: {
      flex: 1,
      padding: "12px 18px",
      fontSize: 14,
      background: "rgba(0,0,0,0.3)",
      border: "1.5px solid rgba(0,160,255,0.3)",
      color: T.text,
      outline: "none",
      fontFamily: "'Open Sans', sans-serif",
      resize: "none",
      lineHeight: 1.5,
      minHeight: 46, maxHeight: 120,
      transition: "border-color 0.2s",
    },
    sendBtn: (disabled) => ({
      width: 46, height: 46,
      background: disabled
        ? "rgba(0,120,180,0.4)"
        : `linear-gradient(135deg, ${C.secondary} 0%, ${C.secondaryDark} 100%)`,
      border: "none",
      cursor: disabled ? "default" : "pointer",
      display: "flex", alignItems: "center", justifyContent: "center",
      flexShrink: 0, transition: "opacity 0.2s",
    }),
    clearBtn: {
      background: "none",
      border: "1px solid rgba(255,255,255,0.15)",
      padding: "8px 14px",
      color: T.muted,
      fontSize: 11, fontWeight: 600,
      letterSpacing: 1, textTransform: "uppercase",
      cursor: "pointer",
      fontFamily: "'Open Sans', sans-serif",
      flexShrink: 0, transition: "all 0.15s",
    },
    hint: {
      textAlign: "center", fontSize: 11,
      color: T.muted, marginTop: 10, letterSpacing: 0.5,
    },
  };

  // ── Markdown-ish renderer ────────────────────────────────────────────────
  function renderText(text) {
    // Convert markdown links [text](url) to <a>
    const parts = text.split(/(\[.*?\]\(.*?\)|\*\*.*?\*\*|\*.*?\*)/g);
    return parts.map((part, i) => {
      const link = part.match(/^\[(.*?)\]\((.*?)\)$/);
      if (link) return <a key={i} href={link[2]} target="_blank" rel="noopener noreferrer" style={{ color: C.secondary, textDecoration: "underline" }}>{link[1]}</a>;
      const bold = part.match(/^\*\*(.*?)\*\*$/);
      if (bold) return <strong key={i}>{bold[1]}</strong>;
      const em = part.match(/^\*(.*?)\*$/);
      if (em) return <em key={i}>{em[1]}</em>;
      return part;
    });
  }

  function renderMessage(text) {
    return text.split("\n").map((line, i) => (
      <p key={i} style={{ margin: i > 0 ? "8px 0 0" : 0 }}>{renderText(line)}</p>
    ));
  }

  const isEmpty = messages.length === 0 && !loading;

  return (
    <div style={s.root}>

      {/* ── Header ── */}
      <header style={s.header}>
        <div className="header-accent" />
        <div style={s.logoMark}>C</div>
        <div>
          <div style={s.logoText}>CADI</div>
          <div style={s.logoSub}>Centre for Academic &amp; Digital Innovation</div>
        </div>
        <div style={s.divider} />
        <span style={s.headerLabel}>Assist</span>
        <div style={s.badge}>Powered by Claude</div>
      </header>

      {/* ── Body ── */}
      {isEmpty ? (

        /* Empty / welcome state */
        <div style={s.emptyWrap}>
          <p style={s.eyebrow}>University of Portsmouth</p>
          <h1 style={s.h1}>
            How can I<br />
            <span style={{ color: C.secondary }}>help you today?</span>
          </h1>
          <p style={s.subtitle}>
            Ask me anything about CPD, fellowship, assessment, learning design and more
          </p>
          <div style={s.chipWrap}>
            {EXAMPLE_PROMPTS.map(q => (
              <button
                key={q}
                onClick={() => send(q)}
                style={s.chip}
                onMouseEnter={e => {
                  e.target.style.background = "rgba(0,160,255,0.12)";
                  e.target.style.borderColor = "rgba(0,160,255,0.4)";
                  e.target.style.color = C.secondary;
                }}
                onMouseLeave={e => {
                  e.target.style.background = "rgba(0,0,0,0.25)";
                  e.target.style.borderColor = "rgba(255,255,255,0.1)";
                  e.target.style.color = T.muted;
                }}
              >{q}</button>
            ))}
          </div>
        </div>

      ) : (

        /* Messages */
        <div style={s.messagesArea}>

          {messages.map((msg, i) => (
            <div key={i} style={s.msgWrap}>
              <div style={s.msgAvatar(msg.role)}>
                {msg.role === "user" ? "You" : "C"}
              </div>
              <div style={s.msgContent}>
                <div style={{ ...s.msgLabel, color: msg.role === "user" ? T.muted : C.secondary }}>
                  {msg.role === "user" ? "You" : "CADI Assist"}
                </div>
                <div style={s.msgBubble(msg.role, msg.error)}>
                  {renderMessage(msg.text)}
                </div>
              </div>
            </div>
          ))}

          {/* Thinking indicator */}
          {loading && (
            <div style={s.thinkingWrap}>
              <div style={s.msgAvatar("assistant")}>C</div>
              <div style={s.msgContent}>
                <div style={{ ...s.msgLabel, color: C.secondary }}>CADI Assist</div>
                <div style={s.thinkingBubble}>
                  {steps.map((label, i) => (
                    <div key={i} style={s.stepRow}>
                      {i === steps.length - 1
                        ? <div style={s.stepSpinner} />
                        : <div style={s.stepDot} />
                      }
                      <span>{label}</span>
                    </div>
                  ))}
                  {steps.length === 0 && (
                    <div style={{ display: "flex", gap: 5 }}>
                      {[0,1,2].map(i => (
                        <div key={i} style={{
                          width: 7, height: 7,
                          background: C.secondary,
                          animation: `bounce 1s ease-in-out ${i * 0.15}s infinite`,
                        }} />
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          <div ref={messagesEndRef} />
        </div>
      )}

      {/* ── Input bar ── */}
      <div style={s.inputBar}>
        <div style={s.inputInner}>
          <textarea
            ref={inputRef}
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={handleKey}
            onFocus={e => { e.target.style.borderColor = C.secondary; }}
            onBlur={e => { e.target.style.borderColor = "rgba(0,160,255,0.3)"; }}
            onInput={e => {
              e.target.style.height = "auto";
              e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px";
            }}
            placeholder="Ask about CPD, fellowship, assessment, learning design…"
            disabled={loading}
            style={s.textarea}
            rows={1}
          />
          <button
            onClick={() => send()}
            disabled={loading || !input.trim()}
            style={s.sendBtn(loading || !input.trim())}
            onMouseEnter={e => { if (!loading && input.trim()) e.currentTarget.style.opacity = "0.85"; }}
            onMouseLeave={e => { e.currentTarget.style.opacity = "1"; }}
          >
            {loading ? (
              <span style={{ width: 18, height: 18, border: `2.5px solid ${C.white}`, borderTopColor: "transparent", display: "block", animation: "spin 0.7s linear infinite" }} />
            ) : (
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={C.white} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            )}
          </button>
          {messages.length > 0 && (
            <button
              onClick={clearChat}
              style={s.clearBtn}
              onMouseEnter={e => { e.target.style.borderColor = "rgba(255,255,255,0.3)"; e.target.style.color = C.white; }}
              onMouseLeave={e => { e.target.style.borderColor = "rgba(255,255,255,0.15)"; e.target.style.color = T.muted; }}
            >Clear</button>
          )}
        </div>
        <p style={s.hint}>Enter to send · Shift+Enter for new line</p>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
